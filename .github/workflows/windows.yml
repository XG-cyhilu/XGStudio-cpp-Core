name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # XGDL / XGNET both need a *static* libcurl (schannel) that this repo does not ship.
      # They are excluded here on purpose: the runner would have to build curl + openssl
      # from source every run, and vcpkg's curl CMake package puts $<LINK_ONLY:...> entries
      # into its interface, which CMake 4.x rejects while generating install(EXPORT) files.
      # Local builds cover them (see README: -D XGDL_CURL_DIR + xgdl_demo --selfcheck).
      #
      # No -G: the runner image keeps moving (VS 2022 / VS 2026), let CMake pick what exists.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B .build -A x64 `
            -DCPPLOCLIB_BUILD_DOWNLOAD=OFF `
            -DCPPLOCLIB_BUILD_NET=OFF `
            -DCPPLOCLIB_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build .build --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir .build -C Release --output-on-failure --timeout 180
